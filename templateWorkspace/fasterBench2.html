<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>FAST Templates Workbench 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
        integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="./styles/vscode.css"> -->
</head>

<body>
    <div id="navbar">
        <a class="navbar-brand" href="#">FAST Templates Workbench</a>
        <button id="refreshButton" class="btn btn-primary ml-2">Refresh</button>
        <select id="additionalDropdown" class="form-control">
            <option id="templateSelect" disabled selected>Select a file</option>

        </select>
    </div>
    <div id="editor"></div>
    <!-- <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@json-editor/json-editor@2.5.1/dist/jsoneditor.min.js"></script>
    <script>
        let schema = {};
        let defaults = {};
        const editor = new JSONEditor(document.getElementById('editor'), {
            schema,
            startval: defaults,
            compact: true,
            show_errors: 'always',
            disable_edit_json: true,
            disable_properties: true,
            disable_collapse: true,
            disable_array_reorder: true,
            disable_array_delete_last_row: true,
            object_layout: 'grid',
            theme: 'bootstrap4'
        });


        const dropdown = document.getElementById('additionalDropdown');
        fetch('.')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const htmlDoc = parser.parseFromString(data, 'text/html');
                const files = Array.from(htmlDoc.querySelectorAll('a')).map(a => a.textContent);
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file;
                    option.textContent = file;
                    dropdown.appendChild(option);
                    // set the default selected file to be "HTTP2.yaml"
                    if (file === 'HTTP2.yaml') {
                        option.selected = true;
                    }   
                });
            })
            .catch(error => console.error('Error fetching files:', error));

        const editorContainer = document.getElementById('editor');
        editorContainer.style.display = 'none'; // Initially hide the editor

        dropdown.addEventListener('change', () => {
            const selectedFile = dropdown.value;
            if (selectedFile.endsWith('.yaml')) { // Ensure it's a YAML file
                fetch(selectedFile)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Failed to fetch file: ${response.statusText}`);
                        }
                        return response.text();
                    })
                    .then(yamlContent => {
                        try {
                            const jsonData = jsyaml.load(yamlContent); // Convert YAML to JSON
                            console.log('Converted JSON:', jsonData);
                            schema = jsonData.definitions;
                            defaults = jsonData.parameters;
                            editorContainer.style.display = 'block'; // Show the editor
                        } catch (error) {
                            console.error('Error parsing YAML:', error);
                        }
                    })
                    .catch(error => console.error('Error loading file:', error));
            } else {
                console.warn('Selected file is not a YAML file.');
            }
        });

        document.getElementById('refreshButton').addEventListener('click', () => {
            // editor.refresh();
            console.log(schema);
            console.log(defaults);
        });

        const fetchButton = document.createElement('button');
        fetchButton.id = 'fetchButton';
        fetchButton.className = 'btn btn-secondary ml-2';
        fetchButton.textContent = 'Fetch';
        dropdown.insertAdjacentElement('afterend', fetchButton);

        fetchButton.addEventListener('click', () => {
            const selectedFile = dropdown.value;
            if (selectedFile) {
                fetch(selectedFile)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Failed to fetch file: ${response.statusText}`);
                        }
                        return response.text();
                    })
                    .then(yamlContent => {
                        try {
                            const jsonData = jsyaml.load(yamlContent); // Convert YAML to JSON
                            console.log('Converted JSON fetch:', jsonData);
                            defaults = jsonData.parameters;
                            const properties = jsonData.definitions;
                            jsonData.properties = properties;
                            delete jsonData.definitions;
                            delete jsonData.contentType
                            delete jsonData.parameters;
                            delete jsonData.template;
                            schema = jsonData;
                            editorContainer.style.display = 'block'; // Show the editor
                        } catch (error) {
                            console.error('Error parsing YAML:', error);
                        }
                    })
                    .catch(error => console.error('Error loading file:', error));
            } else {
                console.warn('No file selected to fetch.');
            }
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</body>

</html>
