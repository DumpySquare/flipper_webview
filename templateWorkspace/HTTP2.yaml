template: |
  {
    "$schema": "https://raw.githubusercontent.com/F5Networks/f5-appsvcs-extension/master/schema/latest/as3-schema.json",
    "class": "AS3",
    "declaration": {
      "class": "ADC",
      "schemaVersion": "3.45.0",
      "id": "urn:uuid:0209b091-aec0-47ff-8da0-cdf10eb6daf6",
      "t_{{tenant}}": {
        "class": "Tenant",
        "{{app_name}}-app": {
          "class": "Application",
          "template": "shared",
          {{#vip}}
          "sa_{{va}}": {
            "class": "Service_Address",
            "icmpEcho": "{{icmp_echo}}",
            "arpEnabled": {{arpEnabled}},
            "virtualAddress": "{{va}}"
          },
          {{/vip}}
          "{{app_name}}": {
            "layer4": "tcp",
            "pool": "pool_{{app_name}}",
            "translateServerAddress": true,
            "translateServerPort": true,
            "class": "Service_HTTP",
            {{#persistence}}
              {{#SOURCEIP}}"persistenceMethods": [{"bigip": "/Common/source_addr"}],{{/SOURCEIP}}
              {{#COOKIEINSERT}}"persistenceMethods": [{"bigip": "/Common/cookie"}],{{/COOKIEINSERT}}
              {{#SSLSESSION}}"persistenceMethods": [{"bigip": "/Common/ssl"}],{{/SSLSESSION}}
              {{#NONE}}"persistenceMethods" : [],{{/NONE}}
            {{/persistence}}
            "profileTCP": {
                "use": "{{app_name}}-tcp"
            },
            "virtualAddresses": [
              { "use": "sa_{{#vip}}{{va}}{{/vip}}" }
            ],
            "virtualPort": {{#vip}}{{vp}}{{/vip}},
            "snat": "auto"
          },
          "pool_{{app_name}}": {
            "members": [
            {{#pool_members}}
              {
              "hostname": {{name}},
              "serverAddresses": ["{{address}}"],
              "sharedNodes": {{shared-nodes}},
              "servicePort": {{port}},
              {{#adminState}}
                {{#ENABLED}}
                "adminState": "enable"
                {{/ENABLED}}
                {{#DISABLED}}
                "adminState": "disable"
                {{/DISABLED}}
                {{#OFFLINE}}
                "adminState": "offline"
                {{/OFFLINE}}
              {{/adminState}}
              },
            {{/pool_members}}
            {{#fqdn_members}}
              {
              "hostname": {{hostname}},
              "servicePort": {{port}},
              "sharedNodes": {{shared-nodes}},
              {{#adminState}}
                {{#ENABLED}}
                "adminState": "enable"
                {{/ENABLED}}
                {{#DISABLED}}
                "adminState": "disable"
                {{/DISABLED}}
                {{#OFFLINE}}
                "adminState": "offline"
                {{/OFFLINE}}
              {{/adminState}}
              },
            {{/fqdn_members}}
            ],
            "class": "Pool",
            {{#lbMethod}}
                {{#ROUNDROBIN}}
                "loadBalancingMode":"round-robin",
                {{/ROUNDROBIN}}
                {{#LEASTCONNECTION}}
                "loadBalancingMode":"least-connections-member",
                {{/LEASTCONNECTION}}
            {{/lbMethod}}
            "monitors": [
              {{#health_monitors}}
              {
                "use": "{{type}}-monitor",
                "interval": {{interval}},
                "timeout": {{timeout}},
                {{#send}}
                "send": "{{send}}",
                {{/send}}
                {{#receive}}
                "recv": "{{receive}}"
                {{/receive}}
              },
              {{/health_monitors}}
              {{#h_monitor}}
              {
                "type": "{{h_type}}-mon",
                "interval": {{h_interval}},
                "timeout": {{h_timeout}},
                "send": "{{h_send}}",
                "recv": "{{h_receive}}"
              },
              {{/h_monitor}}
            ]
          },
          "{{app_name}}-tcp": {
            "idleTimeout": {{idleTimeout}},
            "class": "TCP_Profile"
          }
        }
      }
    },
    "note": "https://json-editor.github.io/json-editor/?"
  }
