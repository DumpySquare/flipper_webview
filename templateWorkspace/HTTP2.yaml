title: HTTP Application Template
description: NS HTTP app
contentType: application/json
definitions:
  app_name:
    title: Application name
    type: string
    propertyOrder: 1
    options:
      input_width: 300px
  tenant:
    title: Tenant name
    type: string
    propertyOrder: 2
    options:
      input_width: 300px
  vip:
    title: Virtual IP
    type: object
    format: grid
    options:
        titleHidden: true
    properties:
        va:
            title: Virtual Address
            type: string
        vp:
            title: Virtual port
            type: integer
        icmp_echo:
            type: boolean
            title: ICMP echo
            format: checkbox
            default: true
        arpEnabled:
            type: boolean
            title: ARP enabled
            format: checkbox
            default: true
  idleTimeout:
    type: integer 
    default: 300
    title: Idle timeout
    propertyOrder: 5
    options:
      input_width: 300px
  persistence:
    title: Persistence
    description: Persistence method
    propertyOrder: 6
    type: string
    enum:
      - NONE
      - SOURCEIP
      - COOKIEINSERT
      - SSLSESSION
    default: NONE
    options:
      input_width: 300px
  lbMethod:
    title: Load balancing method
    type: string
    enum:
      - ROUNDROBIN
      - LEASTCONNECTION
    default: LEASTCONNECTION
    options:
      input_width: 300px
  pool_members:
    title: Static Pool members
    description: List of static pool members
    uniqueItems: true
    type: array
    items:
      type: object
      properties:
        name:
          title: Name
          type: string
          propertyOrder: 1
        address:
          title: Address
          type: string
          propertyOrder: 2
        port:
          title: Port
          type: string
          propertyOrder: 3
        shared-nodes:
          title: Shared nodes
          type: boolean
          default: false
          propertyOrder: 4
        adminState:
          title: Admin State
          type: string
          enum:
            - enable
            - disable
            - offline
          default: "enable"
          propertyOrder: 5
      required:
        - port
        - address
        - adminState
  fqdn_members:
    title: FQDN Pool members
    description: List of FQDN pool members details
    uniqueItems: true
    type: array
    items:
      type: object
      properties:
        hostname:
          title: FQDN
          type: string
        port:
          title: Port
          type: string
        adminState:
          title: Admin State
          type: string
          enum:
            - ENABLED
            - DISABLED
            - OFFLINE
          default: "ENABLED"
        shared-nodes:
          title: Shared nodes
          type: boolean
          default: false
      required:
        - hostname
        - port
        - adminState
  h_monitor:
    title: Single Health monitor
    type: object
    format: grid
    options:
      grid_columns: 2
      disable_collapse: false
      disable_properties: false
      disable_edit_json: false
    properties:
      h_type:
        title: Type
        type: string
        enum:
          - http
          - https
          - icmp
          - tcp
          - udp
        default: http
      h_interval:
        title: Interval
        type: integer
        default: 300
      h_timeout:
        title: Timeout
        type: integer
        default: 150
      h_send:
        title: Send
        type: string
        default: "GET /"
      h_receive:
        title: Receive
        type: string
        default: "200 OK"
  health_monitors:
    title: Health monitors
    description: List of health monitors
    uniqueItems: true
    type: array
    items:
      type: object
      properties:
        name:
          title: Name
          type: string
        type:
          title: Type
          type: string
          enum:
            - http
            - https
            - icmp
            - tcp
            - udp
          default: http
        interval:
          title: Interval
          type: integer
        timeout:
          title: Timeout
          type: integer
        send:
          title: Send
          type: string
        receive:
          title: Receive
          type: string

